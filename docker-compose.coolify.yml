# ─────────────────────────────────────────────────────────────
# GreyAuction — Coolify (self-hosted VPS) deployment stack
#
# Services:
#   postgres    — main app database (port 5432 inside the network)
#   minio       — S3-compatible object storage (zero egress, zero cost)
#   minio-init  — one-shot job that provisions the bucket + makes it public
#   backend     — NestJS API (port 3001)
#   frontend    — Next.js web (port 3000)
#
# Deploy on Coolify via "Docker Compose" resource, or run:
#   docker compose -f docker-compose.coolify.yml up -d --build
#
# Switching asset storage to Cloudflare R2 later is a PURE ENV change:
# set STORAGE_DRIVER=s3 + S3_ENDPOINT/S3_ACCESS_KEY/S3_SECRET_KEY/S3_BUCKET
# to your R2 values — no code or image rebuild required.
# ─────────────────────────────────────────────────────────────

name: greyauction

services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-postgres}
      POSTGRES_DB: ${POSTGRES_DB:-greyauction}
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER:-postgres}"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - greyNet

  minio:
    image: minio/minio:latest
    restart: unless-stopped
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: ${S3_ACCESS_KEY:-greyauction}
      MINIO_ROOT_PASSWORD: ${S3_SECRET_KEY:-change-me-minio-password}
    volumes:
      - miniodata:/data
    ports:
      - "9000:9000"   # S3 API
      - "9001:9001"   # Web console
    healthcheck:
      test: ["CMD", "mc", "ready", "local"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - greyNet

  minio-init:
    image: minio/mc:latest
    depends_on:
      minio:
        condition: service_healthy
    entrypoint: >
      /bin/sh -c "
      mc alias set local http://minio:9000 $${S3_ACCESS_KEY:-greyauction} $${S3_SECRET_KEY:-change-me-minio-password} &&
      mc mb --ignore-existing local/$${S3_BUCKET:-greyauction} &&
      mc anonymous set download local/$${S3_BUCKET:-greyauction} &&
      exit 0
      "
    networks:
      - greyNet

  backend:
    build:
      context: .
      dockerfile: Dockerfile.backend
    restart: unless-stopped
    env_file:
      - .env
    environment:
      NODE_ENV: production
      PORT: 3001
      DB_HOST: postgres
      DB_PORT: 5432
      DB_USERNAME: ${POSTGRES_USER:-postgres}
      DB_PASSWORD: ${POSTGRES_PASSWORD:-postgres}
      DB_DATABASE: ${POSTGRES_DB:-greyauction}
      # Object storage → MinIO (S3-compatible)
      STORAGE_DRIVER: s3
      S3_ENDPOINT: http://minio:9000
      S3_ACCESS_KEY: ${S3_ACCESS_KEY:-greyauction}
      S3_SECRET_KEY: ${S3_SECRET_KEY:-change-me-minio-password}
      S3_BUCKET: ${S3_BUCKET:-greyauction}
      S3_REGION: us-east-1
      S3_FORCE_PATH_STYLE: "true"
    depends_on:
      postgres:
        condition: service_healthy
      minio:
        condition: service_healthy
    ports:
      - "3001:3001"
    networks:
      - greyNet

  frontend:
    build:
      context: .
      dockerfile: Dockerfile.frontend
    restart: unless-stopped
    environment:
      NODE_ENV: production
      NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_API_URL:-http://localhost:3001/api}
      NEXTAUTH_URL: ${NEXTAUTH_URL:-http://localhost:3000}
    depends_on:
      - backend
    ports:
      - "3000:3000"
    networks:
      - greyNet

volumes:
  pgdata:
  miniodata:

networks:
  greyNet:
    driver: bridge
